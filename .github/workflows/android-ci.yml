name: Android CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - name: Verify packaged native engine libraries
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | tee /tmp/roohvpn-apk-files.txt
          grep -Eq 'lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/[^ ]+\\.so      - name: Set up Node.js for control-plane tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test server control plane
        working-directory: server-control-plane
        run: npm test
      - name: Set up Node.js for control-plane tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test server control plane
        working-directory: server-control-plane
        run: npm test
 /tmp/roohvpn-apk-files.txt || { echo "No native .so libraries found in APK; refusing to treat engine packaging as verified."; exit 1; }
          echo "Native ABI entries packaged in APK:"
          grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/[^ ]+\\.so      - name: Set up Node.js for control-plane tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test server control plane
        working-directory: server-control-plane
        run: npm test
      - name: Set up Node.js for control-plane tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test server control plane
        working-directory: server-control-plane
        run: npm test
