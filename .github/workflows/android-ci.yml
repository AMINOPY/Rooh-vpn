name: Android and Control Plane CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep each commit's validation result; do not cancel the previous run just
# because a newer commit is pushed while native Android/Go builds are running.
concurrency:
  group: roohvpn-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Go for PG CORE tests
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            pg-core/go.sum
            xray-core/go.sum
      - name: Test PG CORE Go engine
        working-directory: pg-core
        run: go test ./...
      - name: Test Android Xray core source
        working-directory: xray-core
        run: go test ./...
      - name: Apply RØH Android socket-protection bridge
        working-directory: xray-core
        run: |
          set -euo pipefail
          git apply ../patches/xray/0001-android-socket-protector.patch
          git apply ../patches/xray/0002-propagate-xray-shutdown-errors.patch
          go test ./...
      - name: Build Xray Android AAR
        working-directory: xray-core
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -v -target=android -androidapi 26 -trimpath -ldflags="-s -w -buildid= -checklinkname=0" -o ../app/libs/xray-core.aar ./
          test -s ../app/libs/xray-core.aar
      - name: Package pinned Xray routing databases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          test -s xray-core/assets/geoip.dat
          test -s xray-core/assets/geosite.dat
          cp xray-core/assets/geoip.dat app/src/main/assets/geoip.dat
          cp xray-core/assets/geosite.dat app/src/main/assets/geosite.dat
          sha256sum app/src/main/assets/geoip.dat app/src/main/assets/geosite.dat
      - name: Record Xray AAR packaging metadata
        shell: bash
        run: |
          set -euo pipefail
          aar=app/libs/xray-core.aar
          report=app/libs/xray-core-aar-report.txt
          {
            echo "Artifact: xray-core.aar"
            echo "SHA-256 checksum:"
            sha256sum "$aar"
            echo "AAR size:"
            du -h "$aar"
          } > "$report"
          cat "$report"
      - name: Upload standalone Xray AAR for integration analysis
        uses: actions/upload-artifact@v4
        with:
          name: roohvpn-xray-core-aar
          path: |
            app/libs/xray-core.aar
            app/libs/xray-core-aar-report.txt
          if-no-files-found: error
          retention-days: 7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Compile and test PG CORE Android library
        run: gradle :pg-core-android:testDebugUnitTest
      - name: Assemble Xray and sing-box debug APKs
        run: gradle :app:assembleXrayDebug :app:assembleSingboxDebug
      - name: Verify engine runtimes and native libraries
        shell: bash
        run: |
          set -euo pipefail
          xray_apk=app/build/outputs/apk/xray/debug/app-xray-debug.apk
          singbox_apk=app/build/outputs/apk/singbox/debug/app-singbox-debug.apk
          test -s "$xray_apk"
          test -s "$singbox_apk"
          unzip -l "$xray_apk" > /tmp/roohvpn-xray-files.txt
          unzip -l "$singbox_apk" > /tmp/roohvpn-singbox-files.txt
          grep -Eq 'lib/arm64-v8a/libgojni\\.so' /tmp/roohvpn-xray-files.txt || {
            echo "Xray APK is missing the gomobile runtime."
            exit 1
          }
          grep -Eq 'lib/arm64-v8a/libbox\\.so' /tmp/roohvpn-singbox-files.txt || {
            echo "sing-box APK is missing libbox.so."
            exit 1
          }
          grep -Eq 'lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/[^ ]+\\.so$' /tmp/roohvpn-xray-files.txt
          grep -Eq 'lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/[^ ]+\\.so$' /tmp/roohvpn-singbox-files.txt
          grep -q 'assets/geoip.dat' /tmp/roohvpn-xray-files.txt
          grep -q 'assets/geosite.dat' /tmp/roohvpn-xray-files.txt
          echo "Both engine flavors contain native libraries; Xray flavor includes routing databases."
      - name: Verify isolated Go mobile runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:dependencies --configuration xrayDebugRuntimeClasspath > /tmp/xray-runtime-deps.txt
          gradle :app:dependencies --configuration singboxDebugRuntimeClasspath > /tmp/singbox-runtime-deps.txt
          if grep -qi 'com.github.singbox-android:libbox' /tmp/xray-runtime-deps.txt; then
            echo "Xray flavor must not package sing-box libbox."
            exit 1
          fi
          grep -qi 'com.github.singbox-android:libbox' /tmp/singbox-runtime-deps.txt || {
            echo "sing-box flavor is missing libbox from its runtime classpath."
            exit 1
          }
      - name: Run Android unit tests for both engine flavors
        run: gradle :app:testXrayDebugUnitTest :app:testSingboxDebugUnitTest
      - name: Upload Xray debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roohvpn-xray-debug-apk
          path: app/build/outputs/apk/xray/debug/app-xray-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload sing-box debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roohvpn-singbox-debug-apk
          path: app/build/outputs/apk/singbox/debug/app-singbox-debug.apk
          if-no-files-found: error
          retention-days: 7

  control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test control-plane API
        run: npm test
